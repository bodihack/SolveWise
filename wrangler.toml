#:schema node_modules/wrangler/config-schema.json
name = "cf-statement-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# Environment variables (safe to keep in source control — no secrets here).
# Override per-environment below, or with `wrangler secret put` if you ever
# need to inject sensitive values.
# ---------------------------------------------------------------------------
[vars]
# CORS: the origin allowed to call this Worker. Use "*" while developing,
# then lock it down to your deployed frontend's exact origin in production,
# e.g. "https://your-app.pages.dev".
ALLOWED_ORIGIN = "*"

# How long successful responses stay in Cloudflare's edge cache (seconds).
CACHE_TTL_SECONDS = "86400"

# Per-attempt timeout when calling Codeforces (milliseconds).
REQUEST_TIMEOUT_MS = "10000"

# Total number of attempts (1 initial + retries) against Codeforces.
MAX_RETRIES = "3"

# ---------------------------------------------------------------------------
# Optional: route this Worker to a custom domain/subdomain instead of the
# default *.workers.dev URL. Requires the zone to already be on Cloudflare.
# Uncomment and adjust, then re-run `wrangler deploy`.
# ---------------------------------------------------------------------------
# [[routes]]
# pattern = "api.your-domain.com/api/problem/*"
# zone_name = "your-domain.com"

# ---------------------------------------------------------------------------
# Optional: named environments for staging vs. production. Deploy with
# `wrangler deploy --env production`.
# ---------------------------------------------------------------------------
# [env.production]
# name = "cf-statement-proxy-production"
# vars = { ALLOWED_ORIGIN = "https://your-app.pages.dev", CACHE_TTL_SECONDS = "86400", REQUEST_TIMEOUT_MS = "10000", MAX_RETRIES = "3" }
